version: 1
bot:
  trigger: "@CBReview"
  aliases: [] # Text commands; an alias can notify an unrelated GitHub account.
authorization:
  whitelist: "" # Add authorized GitHub logins. Each uses their own credential.
  blacklist: "*" # Default deny fallback. Other explicit exclusions win.
review:
  enabled: true
  auto_review: false
  auto_approve: true # Set false for initial advisory acceptance.
  request_changes: true
  model: null
  effort: null
  timeout_minutes: 30 # Authorized commands may override, e.g. --timeout 60. GitHub job limits still apply.
  blocking_confidence: 0.9
  advisory_confidence: 0.7
merge:
  enabled: false
  auto_merge_on_approval: false # Explicit opt-in; otherwise --merge is required.
  method: squash
  minimum_human_approvals: 0 # Fully Autonomous. Use 1–6 for Human-in-the-Loop.
  guard_check: "CodexBot reviewed commit"
  authorization:
    whitelist: ""
    blacklist: "*"
credentials:
  mode: chatgpt # Or api-key. No automatic paid fallback.
  automatic_reviewer: null # Administrator login, after explicit --allow-automatic-reviews consent.
quotas:
  user_per_day: 10
  repository_per_day: 40
  installation_per_day: 200
  concurrent_repository: 1
  concurrent_installation: 4
  cooldown_seconds: 60
  reruns_per_day: 2
